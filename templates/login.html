{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-6 col-lg-5">
        <div class="card border-0 shadow-lg rounded-4 overflow-hidden bg-white text-dark mt-4">
            <!-- Header card strip -->
            <div class="bg-dark text-light p-4 text-center border-bottom border-secondary">
                <i class="fa-solid fa-graduation-cap text-info fs-1 mb-2"></i>
                <h4 class="fw-bold mb-0">SMS Admin Portal</h4>
                <p class="text-secondary small mb-0">Please sign in to access management controls</p>
            </div>
            
            <div class="card-body p-4 p-md-5">
                <form method="POST" action="{{ url_for('students.login') }}" class="needs-validation" novalidate>
                    <!-- Username field -->
                    <div class="mb-4">
                        <label for="username" class="form-label fw-semibold">Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-2 border-end-0 text-secondary"><i class="fa-solid fa-user"></i></span>
                            <input type="text" class="form-control form-control-lg border-2 border-start-0" id="username" name="username" placeholder="Enter admin username" required>
                            <div class="invalid-feedback">
                                Username is required.
                            </div>
                        </div>
                    </div>

                    <!-- Password field -->
                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-2 border-end-0 text-secondary"><i class="fa-solid fa-lock"></i></span>
                            <input type="password" class="form-control form-control-lg border-2 border-end-0 border-start-0" id="password" name="password" placeholder="Enter admin password" required>
                            <button type="button" class="btn btn-outline-secondary border-2 border-start-0 bg-light" id="toggle-password" title="Show/Hide Password">
                                <i class="fa-solid fa-eye text-secondary" id="eye-icon"></i>
                            </button>
                            <div class="invalid-feedback">
                                Password is required.
                            </div>
                        </div>
                    </div>

                    <!-- Submit action button -->
                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-info btn-lg py-2.5 rounded-3 text-white fw-semibold shadow-sm">
                            <i class="fa-solid fa-arrow-right-to-bracket me-2"></i>Sign In
                        </button>
                    </div>
                </form>
            </div>
            <div class="card-footer bg-light border-0 py-3 text-center small text-secondary">
                Secure Session Authentication. Authorized Personnel Only.
            </div>
        </div>
    </div>
</div>

<script>
    // Toggle Password visibility logic
    document.addEventListener("DOMContentLoaded", () => {
        const passwordField = document.getElementById("password");
        const toggleButton = document.getElementById("toggle-password");
        const eyeIcon = document.getElementById("eye-icon");

        if (toggleButton && passwordField) {
            toggleButton.addEventListener("click", () => {
                if (passwordField.type === "password") {
                    passwordField.type = "text";
                    eyeIcon.classList.remove("fa-eye");
                    eyeIcon.classList.add("fa-eye-slash");
                } else {
                    passwordField.type = "password";
                    eyeIcon.classList.remove("fa-eye-slash");
                    eyeIcon.classList.add("fa-eye");
                }
            });
        }

        // Custom Bootstrap form validation activator
        var forms = document.querySelectorAll('.needs-validation')
        Array.prototype.slice.call(forms)
            .forEach(function (form) {
                form.addEventListener('submit', function (event) {
                    if (!form.checkValidity()) {
                        event.preventDefault()
                        event.stopPropagation()
                    }
                    form.classList.add('was-validated')
                }, false)
            })
    });
</script>
{% endblock %}
